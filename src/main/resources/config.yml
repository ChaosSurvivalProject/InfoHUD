# ============================================================
#  InfoHUD 配置文件
#  改完用 /infohud reload 生效（无需重启服务器）
#  颜色写法两种都支持，也可以混在一行里写：
#    传统代码 —— &a、§a、&l（0-9 a-f、k-o、r），十六进制用 &#RRGGBB
#    MiniMessage —— <red>、<bold>、<gradient:#00ff00:#0000ff>、<click:run_command:/kit>
#  优先级见下面 hud.text-mode
# ============================================================

hud:
  # 玩家默认是否开启 HUD（个人开关会覆盖它，见 storage）
  enabled-by-default: true

  # ActionBar 刷新间隔（tick）。20 = 每秒一次；填小于 10 的值会被强制抬到 10（0.5 秒）
  update-interval-ticks: 20

  # 显示格式。可用占位符：
  #   %gametime%   游戏时间 HH:MM
  #   %realtime%   现实时间 HH:MM:SS（时区见 timezone）
  #   %daynight%   时段标签（日出/白天/日落/黑夜，见 day-night.labels）
  #   %biome%      当前生物群系名（见 biome-names 映射）
  #   %biome_id%   生物群系原始英文 ID
  #   %world%      世界名
  #   %x% %y% %z%  玩家坐标（整数）
  #   %ping%       玩家延迟
  #   %tps%        服务器 TPS（保留 1 位小数）
  display-format: "&7游戏时间 &f%gametime% &8| &7现实时间 &f%realtime% &8| &7%daynight% &8| &7群系 &f%biome%"

  # 现实时间格式（Java DateTimeFormatter 模式）
  realtime-format: "HH:mm:ss"

  # 服务器时区（IANA 名称）。写错会退回系统默认时区并在控制台告警
  timezone: "Asia/Shanghai"

  # 文本解析模式：
  #   auto        —— 自动识别：出现 MiniMessage 标签就走 MiniMessage，否则按 §/& 传统代码
  #   legacy      —— 只按传统颜色代码解析（&a、§a、&l …）
  #   minimessage —— 强制按 MiniMessage 解析（传统代码会被自动转换成 MiniMessage 标签）
  text-mode: auto

  # 允许在配置里写 "&a" 这种 & 开头的颜色代码（关掉后 & 只当普通字符）
  ampersand-colors: true

  # 装了 PlaceholderAPI 时，是否把 HUD 文本再交给 PAPI 解析一次
  # （这样可以在 display-format 里写 %player_name% 等外部占位符）
  placeholderapi-parse: true

  # 每条 ActionBar 组件解析结果的缓存开关。同屏玩家文本相同时复用组件，50+ 人明显省 CPU
  cache-components: true

# ------------------------------------------------------------
# 昼夜时段判定（tick 区间，单位与 world.getTime() 一致：0~24000）
#   0/24000 = 06:00 日出     6000 = 12:00 正午
#   12000 = 18:00 日落       18000 = 00:00 午夜
# 判定优先级：日出 → 白天 → 日落 → 黑夜，全部不匹配时按“白天”兜底
# ------------------------------------------------------------
day-night:
  sunrise-start: 0
  sunrise-end: 1000
  # 夜间尾段也算日出（原版 23000~24000 天色开始发亮）。填 -1 关闭这段回绕
  sunrise-late-start: 22000
  day-start: 1000
  day-end: 11000
  sunset-start: 11000
  sunset-end: 13000
  night-start: 13000
  night-end: 23000

  # 时段标签，可以直接在标签里带颜色
  labels:
    sunrise: "&e日出"
    day: "&a白天"
    sunset: "&6日落"
    night: "&9黑夜"

# ------------------------------------------------------------
# 群系切换提示
# ------------------------------------------------------------
biome-notification:
  # 总开关。留 true 即可：具体展示方式由下面的 mode 决定（mode: off 与 enabled: false 等价）
  enabled: true

  # 展示方式，三选一：
  #   title —— 屏幕中央大字（默认，停留 center-duration-seconds 秒）
  #   chat  —— 聊天栏消息（文案见 message-format）
  #   off   —— 关闭，完全不提示（与 enabled: false 效果相同）
  # 兼容旧写法：center = title，none/false = off
  mode: title

  # mode=chat 时使用的聊天栏文案
  message-format: "&a[InfoHUD] &e已到达 &b%biome%"

  # mode=title 时使用的中央大字标题，支持占位符：
  #   %biome%     群系显示名
  #   %biome_id%  群系原始英文 ID
  #   %player%    玩家名
  # 可用同样的颜色代码 / MiniMessage 标签
  center-title: "&f%biome%"

  # 标题下方的横线（subtitle），形状是：   ————✦————
  #   divider         填充字符，只写纯字符（不要写颜色代码）。默认中文破折号 "—"，
  #                   它在原版字体里撑满字格，连续重复会首尾相接成一条实线；
  #                   写空串 "" 表示不画填充、只留中间符号
  #   divider-symbol  横线正中的符号，默认 "✦"；写空串 "" 就是一条纯横线
  #                   填充在符号左右等长，所以符号始终精确落在屏幕正中
  #   divider-scale   横线显示宽度 = 标题显示宽度 × 这个倍数（0 = 不画线，上限 12）
  #                   横线放在 subtitle 里（客户端缩放只有 title 的一半），
  #                   字符数会按缩放比自动补足，所以不用为 subtitle 手动加长
  # 横线颜色跟随标题（白色标题 → 白色横线），统一加粗、不用斜体；
  # 横线宽度还会被夹在屏幕内，长群系名也不会被裁掉
  divider: "—"
  divider-symbol: "✦"
  divider-scale: 2.5

  # mode=title 时大字在屏幕上停留的秒数（1~10，超出范围会被夹回）
  center-duration-seconds: 3

  # 群系记忆：同一个群系在这个秒数内已经展示过，就不再重复展示
  #   —— 在平原/森林之间来回走不会反复弹同一个名字
  # 按“玩家 + 群系”分别计时；0 = 关闭记忆（每次进入群系都提示）
  # 范围 0~86400（24 小时），只存在内存里，不落盘：玩家下线或重启服务器后清空
  memory-seconds: 300

  # 距上次提示至少移动多少格才发提示，防止在群系交界线上反复横跳刷屏
  # 填 0 表示每次群系变化都提示
  min-move-distance: 5

  # 同一个玩家两次群系查询的最小间隔（tick）。0 = 每次跨方块都查
  query-cooldown-ticks: 5

  # 只在区块已加载时查询群系（强烈建议保持 true：避免主线程触发区块生成）
  loaded-chunk-only: true

  # 切换世界（如下界/末地）时是否立刻提示
  notify-on-world-change: true

# ------------------------------------------------------------
# 顶部 BossBar 罗盘（方向指示：以朝向为中心的 180° 刻度窗口）
# 刻度：N/E/S/W 方位字 + 30° 角度数字（如 30/60/330）+ 5° 圆点
# 进度条位置即指针：北 = 0%、东 = 25%、南 = 50%、西 = 75%
# 正中一格的高亮刻度就是当前朝向，不再单独显示角度数字
# 随玩家视角转向自动更新；与底部信息栏完全独立开关
#   /infohud toggle          切底部信息栏
#   /infohud toggle compass  切顶部罗盘
#   /infohud toggle healthbar  切受击血条
# ------------------------------------------------------------
compass:
  # 玩家默认是否开启罗盘（个人开关会覆盖它，见 storage）
  enabled-by-default: true

  # 罗盘刷新间隔（tick）。1 = 跟视角实时转；调大可进一步降低主线程开销
  update-interval-ticks: 2

  # BossBar 颜色（RED / GREEN / YELLOW / BLUE / PURPLE / PINK / WHITE）
  boss-bar-color: WHITE

  # BossBar 样式（SOLID / SEGMENTED_6 / SEGMENTED_10 / SEGMENTED_12 / SEGMENTED_20）
  # SEGMENTED_10 自带 10 段刻度
  boss-bar-style: SEGMENTED_10

# ------------------------------------------------------------
# 受击生物血条（每个"攻击者 + 生物"组合各自一条独立 BossBar）
# 玩家攻击生物（近战，或玩家射出的箭/弩箭/雪球/药水等投射物）时，为**该攻击者**
# 生成一条只有他自己看得见的血条，停留 time 个 tick（默认 60 = 3 秒）后自动消失；
# 期间再被同一人攻击会刷新内容与倒计时，死亡时切换为 title.dead 模板、进度归零，
# 并且只再停留 dead-time 个 tick（默认 20 = 1 秒）
# 血条互相独立：A 打了僵尸，只有 A 能看到；B 看不到，B 自己打了才会出现 B 的那条，
# 两条各自计时、互不影响（同一只生物死亡时，所有攻击者的血条都切到死亡样式）
# 注意：自然掉血（摔落/火焰/溺水/窒息/虚空）与怪物互殴等非玩家来源不显示血条
# 每名玩家可用 /infohud toggle healthbar 自己开关（权限 infohud.healthbar）
# 标题占位符（MiniMessage 标签与 & 颜色代码可混用；& 代码是否生效见 hud.ampersand-colors）：
#   <entity>  生物的原版翻译名（translatable 组件，客户端按自己语言渲染成"末影人/Enderman"）
#   <name>    生物自定义名；没有名字时显示 <entity>
#   <health>  当前生命值（死亡显示 0）
#   <max>     最大生命值
#   <damage>  本次受到的最终伤害（已扣护甲等修正）
# ------------------------------------------------------------
bar:
  # 血条显示总开关（服务端总闸：关掉后所有玩家都收不到血条；
  # reload 会摘掉已显示的血条）
  enabled: true

  # 玩家默认是否接收血条（个人开关会覆盖它，见 storage 与 /infohud toggle healthbar）
  # 留空或删掉这一行时跟随 enabled 的取值
  enabled-by-default: true

  title:
    living: "<gray><health>/<max> <reset><name> -<damage><red>♥"
    dead: "<gray><health>/<max> <dark_gray>☠ <name> ☠ <reset>-<damage><red>♥"

  # BossBar 样式。Adventure 名与 Bukkit 名都认，一一对应：
  #   PROGRESS=SOLID、NOTCHED_6/10/12/20 = SEGMENTED_6/10/12/20
  overlay: PROGRESS

  # BossBar 颜色（RED / GREEN / YELLOW / BLUE / PURPLE / PINK / WHITE）
  color: RED

  # 存活状态下血条停留时间（tick，20 = 1 秒，60 = 3 秒；范围 20~2000）
  time: 60

  # 死亡状态下血条停留时间（tick）。死亡后切到 title.dead 模板，只再显示这么久
  # 默认 20 = 1 秒（不用和存活一样久）；范围 20~2000
  dead-time: 20

# 血条黑名单：名单内的实体类型不显示血条
# （实体类型名，大小写不敏感，可带 minecraft: 前缀）
blacklist:
  - ENDER_DRAGON
  - WITHER
  - PLAYER
  - ARMOR_STAND

# ------------------------------------------------------------
# 玩家偏好存储
# ------------------------------------------------------------
storage:
  # false（默认）：偏好写到插件目录的 data.yml，config.yml 的注释不会被破坏
  # true          ：按 Plugin#getConfig() 方式写进 config.yml 的 player-preferences 节点
  #                 注意 Bukkit 的 saveConfig() 会重写整个 config.yml 并丢掉注释
  preferences-in-config: false

  # 偏好落盘的防抖时间（秒）。期间多次 toggle 只写一次文件
  save-debounce-seconds: 5

