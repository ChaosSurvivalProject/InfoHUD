# InfoHUD —— Paper / Purpur 服务端插件描述文件
# api-version 用 "1.21" 主版本形式，Paper 与 Purpur 都能识别（1.21.11 服务端同样接受）
name: InfoHUD
version: '${version}'
main: dev.infohud.InfoHUD
api-version: '1.21'
description: 在 ActionBar 上实时显示游戏时间、现实时间、昼夜状态与生物群系，在顶部 BossBar 显示方向罗盘，为受击生物显示独立 BossBar 血条
author: AutoMods
load: POSTWORLD

# PlaceholderAPI 只是可选集成：没装也能正常跑
softdepend:
  - PlaceholderAPI

commands:
  infohud:
    description: InfoHUD 主命令（重载 / 开关信息栏与罗盘 / 查看状态）
    usage: |-
      &e用法:&r
      &7/infohud &f- 显示帮助
      &7/infohud reload &f- 重载配置文件 &8(infohud.admin)
      &7/infohud toggle &f- 开关底部信息栏 &8(infohud.use)
      &7/infohud toggle compass &f- 开关顶部罗盘 &8(infohud.compass)
      &7/infohud toggle healthbar &f- 开关受击血条 &8(infohud.healthbar)
      &7/infohud toggle <actionbar|compass|healthbar> [玩家] &f- 代管他人 &8(infohud.admin)
      &7/infohud status &f- 查看当前 HUD 内容与运行参数
    aliases:
      - ihud
      - hud

permissions:
  # 允许接收 HUD（ActionBar）推送
  infohud.use:
    description: 接收底部信息栏 HUD，并可开关自己的信息栏
    default: true
  # 允许接收顶部 BossBar 罗盘（方向指示），与信息栏独立开关
  infohud.compass:
    description: 接收顶部方向罗盘，并可开关自己的罗盘
    default: true
  # 允许接收受击生物血条（仅影响该玩家自己是否看到；血条生成仍由 bar.enabled 与黑名单决定）
  infohud.healthbar:
    description: 接收受击生物血条，并可开关自己的血条
    default: true
  # 群系切换提示
  infohud.notify:
    description: 进入新生物群系时收到提示
    default: true
  # 管理权限：重载配置、代管其他玩家的开关
  infohud.admin:
    description: 允许执行 /infohud reload 以及修改其他玩家的 HUD 状态
    default: op
  infohud.*:
    description: InfoHUD 全部权限
    default: op
    children:
      infohud.use: true
      infohud.compass: true
      infohud.healthbar: true
      infohud.notify: true
      infohud.admin: true
